[tools]
bat = "latest"
# Keep Intel macOS support alongside Linux and Apple Silicon.
delta = "0.18.2"
jq = "latest"
# Provides `tree` through an alias in .zshrc.
eza = "latest"
gh = "latest"
neovim = "latest"
uv = "latest"
typst = "latest"

# Native AI CLIs; no Node.js runtime required.
codex = "latest"
claude = "latest"

# Python for direct use; IPython runs in its own uv-managed environment.
python = "latest"
"pypi:ipython" = "latest"

[bootstrap.packages]
# Linux only; skipped on macOS, which ships zsh.
"apt:zsh" = "latest"
"dnf:zsh" = "latest"

[bootstrap.user]
# /bin/zsh exists on macOS, Ubuntu, and Fedora.
login_shell = "/bin/zsh"

[env]
# Keep Claude updates under mise, alongside the other tools.
DISABLE_AUTOUPDATER = "1"

[tasks.update]
description = "Pull this repository, apply it, and upgrade tools"
run = ["git -C ~/.config/mise pull --ff-only", "mise bootstrap", "mise upgrade"]

[dotfiles]
"~/.zshrc" = { source = "dot_config/shell/.zshrc", mode = "symlink" }
"~/.config/nvim" = { source = "dot_config/nvim", mode = "symlink" }

"~/.config/bat/config" = { source = "dot_config/bat/config", mode = "symlink" }
"~/.config/git/config" = { source = "dot_config/git/config", mode = "symlink" }

"~/.config/ghostty/config.ghostty" = { source = "dot_config/ghostty/config.ghostty", mode = "symlink" }
